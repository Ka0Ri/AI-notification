[project]
name = "ai-notification"
version = "0.1.0"
description = "Config-driven Discord notification services"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.1.1",
    "pyyaml>=6.0",
    "uvicorn>=0.52.4",
]

[project.optional-dependencies]
report = ["openai>=1.40"]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
notify = "aiseed_notify.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiseed_notify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
