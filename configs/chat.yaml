# The on-demand agent. One config = one run.
#
# Same services, same tools, same fact discipline as configs/agent.yaml - but opened by a
# question in Discord instead of a timer, and answered in prose instead of a verdict.
# Run it as a daemon: `notify chat configs/chat.yaml`.

name: chat
description: seedcam Fleet Agent Chat
env_file: /home/aiseed/.config/aiseed-notify/env

registry: configs/services.yaml

chat:
  # A bot token, not the webhook: receiving messages needs a gateway connection.
  token: ${DISCORD_BOT_TOKEN}

  # Set this and /ask appears immediately in that server. Unset, it registers globally
  # and Discord may take an hour to show it.
  guild_id: ${DISCORD_GUILD_ID}

  # Who may spend money by asking. Empty means anyone who can see the command; fill at
  # least one of these if the server has members who should not run the agent.
  allowed_channels: []
  allowed_users: []

  # Seconds before an unanswered question is abandoned. Discord stops accepting the
  # deferred reply at 900.
  deadline: 600
  max_reply_chars: 1900

  # Where seedcam writes its media (its DATA_DIR). A tool that saves a file reports the
  # path relative to this, and the bot attaches the file itself to the reply.
  media_base: /mnt/ssd/data

  # Routine checks and actions, each registered as its own slash command. The prompt IS
  # the question - it goes through the same investigation as a typed /ask, so a new command
  # is an entry here and nothing in the code. `{yesterday}` in a prompt becomes a real date
  # when the command runs, and each name under `args` becomes a Discord argument that the
  # operator fills and that replaces `{name}` in the prompt.
  commands:
    - name: data-check
      description: Files each local camera wrote recently, and which cameras are live now
      prompt: >
        Report on the local seedcam recording. Call seedcam data_status with no
        arguments for the files each camera wrote since `since`, and seedcam
        camera_status for which cameras are live. Name every camera that is not live and
        every camera that wrote no file in the window, with its newest file time.
        Schedules differ per camera, so fewer files than another camera is not a finding.
        Give the disk usage. If every camera is live and writing, say so.

    - name: ptz
      description: Point a PTZ camera - nudge it, send it to a preset, or read where it looks
      args:
        - name: action
          description: left, right, up, down, zoom in, zoom out, preset 3, or where is it pointing
        # Optional, so an operator who does not know what exists can leave it out and pick
        # from the menu. `where` keeps the fixed cameras out - they cannot be pointed - and
        # incidentally keeps the list under Discord's cap of 25.
        - name: camera
          description: Camera id. Leave it out to choose from a list.
          optional: true
          choices:
            tool: seedcam__camera_status
            value: id
            label: site
            where: {type: ptz}
          # Read in code and shown on the button, so the operator sees where the camera is
          # now before anything moves. Nothing is called until Confirm is pressed.
          confirm:
            tool: seedcam__camera_status
            argument: camera
      prompt: >
        The operator wants this done to camera {camera}: {action}. Call seedcam
        camera_status with no arguments and take the id {camera} names - it may name the
        camera by its Korean `site` instead - and move nothing if it matches more than one
        id or none. If the action only asks where the camera points or what presets it
        has, read and answer without moving it. Otherwise read its position from
        camera_status, call `move` once with the preset, or with pan, tilt and zoom for
        the smallest change that satisfies the action, then read camera_status again.
        Report the position before and after, and name the camera you moved.

    - name: snapshot
      description: Capture one frame from a camera now and post it here
      args:
        - name: camera
          description: Camera id. Leave it out to choose from a list.
          optional: true
          choices:
            tool: seedcam__camera_status
            value: id
            label: site
            # snapshot works on any camera, but the fleet is over Discord's cap of 25
            # options; a fixed camera is still reachable by typing its id.
            where: {type: ptz}
      prompt: >
        Capture one frame from camera {camera} now. Call seedcam camera_status with no
        arguments, take the id {camera} names, and call `snapshot` once with it. Do not move the camera and do
        not call it twice. Name the camera and its site and say the frame was captured; the
        image is posted beside your answer, so never describe it or repeat its path.

    - name: bmonitor-check
      description: Is bmonitorzm recording every camera, and is the host healthy
      prompt: >
        Report on the bmonitorzm recording host. Call bmonitor data_status with no
        arguments for the files each camera wrote since `since`, and bmonitor
        camera_status for which cameras are live. Name every camera that is not live and
        every camera that wrote no file in the window, with its newest file time.
        Schedules differ per camera, so fewer files than another camera is not a finding.
        Give the disk usage and say so if it is above 80% used. If nothing is wrong, say so.

ai:
  model: gpt-oss-120b
  timeout: 120

  # Room for a sweep: a camera with 9 presets costs `camera_status` and a move/snapshot
  # pair per preset, each pair its own turn because the move must land
  # before the frame is pulled. 6 turns cut that off after one frame.
  max_turns: 24
  max_tool_calls: 24
  max_output_tokens: 4000
  reasoning_effort: low

  # Truncation applied to each tool result before it enters the context.
  max_result_chars: 20000

  instruction: |
    You are the monitoring agent for an AI Seed camera deployment, answering a question
    an operator just typed in Discord. Each subscribed service runs an MCP server. The
    context lists them, says which are reachable, and carries each server's own
    explanation of how it works and what its results mean - read it before using that
    service's tools, and let it decide what counts as a fault.

    The tools own every fact. Counts, sizes, percentages, gaps and comparisons are
    computed in code and returned ready to use. Quote them; never derive, estimate or
    combine numbers yourself. If a number the question needs is in no tool result, say
    it is unavailable.

    How to answer:
    - Call only the tools the question needs: start with the no-argument form, drill down
      only where a result points, and stop as soon as you can answer. Every call costs money.
    - Several services may have cameras with the same name. If the question does not say
      which, cover every service that has one and name the service in the answer.
    - A service listed as UNREACHABLE is part of the answer; say so plainly.
    - Use a tool that changes something only when the operator asked for that change on a
      target you can resolve exactly. Otherwise change nothing and point them to the
      command below that offers a menu.
    - If the question is vague, answer its most useful reading rather than asking back.
    - Files a tool saves are attached to your reply by the bot. You never see them, so
      never describe one or repeat its path.

    Write the answer as a direct reply: a sentence or two, then the exact numbers the
    tools returned and the window they cover. Plain text, no markdown, under 150 words.
    Lead with the answer, not with what you did. When a result calls for something an
    operator command below does, name that command.
