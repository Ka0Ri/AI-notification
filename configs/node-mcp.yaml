# Host-level MCP server: the "check disk" and "check GPU" services.
#
# The agent may only look at what is listed here. Adding a mount or a unit to these
# lists is how you widen what it can see.

name: node-mcp
host: 127.0.0.1
port: 8932

disk_paths:
  - /
  - /mnt/ssd
  - /mnt/data

systemd_units:
  - seedcam.service
  - nas-backup.service
  - nas-backup-rda.service
