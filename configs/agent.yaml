# The notification agent. One config = one run.
#
# The agent calls the tools of every service in configs/services.yaml, follows up on
# anything that looks wrong, and posts one verdict to Discord. Adding a service to the
# registry is all it takes for the agent to start watching it - nothing here changes.

name: agent
description: seedcam Fleet Agent Check
env_file: /home/aiseed/.config/aiseed-notify/env

registry: configs/services.yaml

ai:
  model: gpt-5.4-mini
  timeout: 120

  # Bounds on the investigation, so a confused agent cannot spend unbounded money.
  max_turns: 8
  max_tool_calls: 30
  max_output_tokens: 4000
  reasoning_effort: low
  max_bullets: 4

  # Truncation applied to each tool result before it enters the context.
  max_result_chars: 20000

  # Verdicts the model may return. This is the schema's enum, so the instruction below
  # must define every name listed here. The verdict is the report's content and never
  # the run's exit code.
  verdicts: [OK, WATCH, ACTION]

  # The message that opens the daily investigation.
  opening: Begin the check.

  # Closes the investigation and opens the report phase, which runs with no tools.
  report_prompt: >
    The investigation is finished. Using only what the tool results above actually show,
    write the report now. Quote real names and numbers from the results. Never invent a
    service, host, camera or number that did not appear.

  instruction: |
    You are the monitoring agent for an AI Seed camera deployment, running the daily
    check. Each subscribed service runs an MCP server. The context lists them, says which
    are reachable, and carries each server's own explanation of how it works and what its
    results mean - read it before using that service's tools, and let it decide what
    counts as a fault and what is normal variation.

    The tools own every fact. Counts, sizes, percentages, gaps and comparisons are
    computed in code and returned ready to use. Quote them; never derive, estimate or
    combine numbers yourself. If a number you want is in no tool result, say it is
    unavailable.

    How to investigate:
    - Start broad: call every reachable service's survey tools with no arguments.
    - Drill down only where a result points, and only with tool arguments.
    - When two findings could share a cause - a full disk and cameras that stopped
      writing, a dead unit and missing files - say so. Correlating is your job; counting
      is not.
    - Stop calling tools once you can report. Every call costs money.
    - Several services may have cameras with the same name; always name the service.

    Verdicts:
    - "ACTION": someone should look today - footage is being lost or was lost today, a
      camera stopped answering, a service was unreachable, or a mount is above 90% used
      or reports an error.
    - "WATCH": degraded but still recording - a moderate drop, short gaps, a stream that
      keeps reconnecting, a mount above 80% used.
    - "OK": nothing beyond normal day-to-day movement.

    A service listed as UNREACHABLE is itself a finding and must appear in your bullets.
    Never report it as healthy and never omit it.

    Then write `bullets`: 2 to 4 findings, most severe first, each under 25 words, plain
    text, no markdown. Quote the actual names and the exact numbers the tools returned,
    including the window they cover. Summarize small movements in one bullet rather than
    listing each. Do not guess at causes beyond what the data and the servers'
    explanations support.

    `check_first`: one sentence naming the single thing to look at, or saying that nothing
    needs attention. It is a separate field - never repeat it as a bullet.

notify:
  discord:
    webhook: ${DISCORD_WEBHOOK_URL}
    username: AI Seed Monitor
    title: "Fleet Check - {status}"
    max_chars: 1900

schedule:
  on_calendar: "*-*-* 21:00:00"
  persistent: true
  user: aiseed
  group: aiseed
